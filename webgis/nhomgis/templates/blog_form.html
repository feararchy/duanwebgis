{% extends 'layout.html' %}
{% block content %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="bi bi-pencil-square"></i> Đăng bài viết mới</h4>
                </div>
                <div class="card-body p-4">
                    
                    <form action="{% url 'blog_create' %}" method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Tiêu đề bài viết <span class="text-danger">*</span></label>
                            <input type="text" name="title" class="form-control" required placeholder="Nhập tiêu đề...">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Ảnh bìa (Tùy chọn)</label>
                            <input type="file" name="thumbnail" class="form-control" accept="image/*">
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label fw-bold">Nội dung bài viết <span class="text-danger">*</span></label>
                            <textarea name="content" class="form-control" rows="10" required placeholder="Nhập nội dung chi tiết..."></textarea>
                        </div>
                        
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'blog_list' %}" class="btn btn-outline-secondary">Hủy bỏ</a>
                            <button type="submit" class="btn btn-primary"><i class="bi bi-cloud-upload"></i> Đăng bài</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
