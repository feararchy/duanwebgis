{% extends 'layout.html' %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-0">
                <div class="card-body p-4 text-center">
                    <h3 class="fw-bold text-primary">Xác minh Email</h3>
                    <p class="text-muted">Mã OTP đã được gửi vào hòm thư Mailtrap của bạn.</p>
                    <form method="POST">
                        {% csrf_token %}
                        <input type="text" name="otp" class="form-control form-control-lg text-center mb-3" placeholder="Nhập 6 số" required>
                        <button type="submit" class="btn btn-primary w-100 fw-bold">XÁC NHẬN</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
