{% extends 'layout.html' %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 text-center">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h4 class="fw-bold">Xác nhận mã OTP</h4>
                    <p>Mã đã được gửi vào hòm thư <b>Mailtrap</b> của bạn.</p>
                    <form method="POST">
                        {% csrf_token %}
                        <input type="text" name="otp" class="form-control form-control-lg text-center mb-3" placeholder="6 chữ số" required>
                        <button type="submit" class="btn btn-primary w-100">XÁC MINH</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
