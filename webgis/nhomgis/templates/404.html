{% extends 'layout.html' %}

{% block title %}404 - Không tìm thấy trang{% endblock %}

{% block content %}
<div class="container text-center" style="margin-top: 100px; margin-bottom: 150px;">
    <h1 class="display-1 text-warning fw-bold">404</h1>
    <h2 class="mb-4">Trang Không Tồn Tại</h2>
    <p class="lead text-muted">Xin lỗi, đường dẫn bạn đang tìm kiếm không tồn tại, đã bị đổi tên hoặc gỡ bỏ khỏi hệ thống.</p>
    
    <div class="mt-4">
        <a href="{% url 'home' %}" class="btn btn-primary me-2">
            <i class="fas fa-home"></i> Về trang chủ
        </a>
        <button onclick="history.back()" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left"></i> Quay lại
        </button>
    </div>
</div>
{% endblock %}
