{% extends 'layout.html' %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white text-center py-3">
                    <h5 class="mb-0 fw-bold">KHÔI PHỤC MẬT KHẨU</h5>
                </div>
                <div class="card-body p-4">
                    <p class="text-muted small">Nhập email bạn đã đăng ký, chúng tôi sẽ gửi mã OTP để xác minh.</p>
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <input type="email" name="email" class="form-control" placeholder="Email của bạn" required>
                        </div>
                        <button type="submit" class="btn btn-warning w-100 fw-bold">GỬI MÃ XÁC MINH</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
