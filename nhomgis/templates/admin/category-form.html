{% extends 'layout.html' %}
{% block content %}
<div class="container mt-5" style="max-width: 600px;">
    <h3 class="fw-bold mb-3"><i class="bi bi-plus-square"></i> Thêm Danh Mục Mới</h3>
    <form action="{% url 'category_save' %}" method="POST" class="bg-white p-4 shadow-sm rounded border">
        {% csrf_token %}
        <div class="mb-3">
            <label class="fw-bold">Tên Danh Mục:</label>
            <input type="text" name="name" class="form-control" placeholder="VD: Cát, Đá, Xi măng..." required>
        </div>
        <div class="d-flex justify-content-between">
            <a href="{% url 'categories' %}" class="btn btn-secondary">Hủy bỏ</a>
            <button type="submit" class="btn btn-success fw-bold"><i class="bi bi-save"></i> Lưu Danh Mục</button>
        </div>
    </form>
</div>
{% endblock %}
