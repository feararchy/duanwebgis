{% extends 'layout.html' %}
{% block content %}
<div class="container mt-4 mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold text-uppercase"><i class="bi bi-tags text-success"></i> Quản lý Danh Mục</h3>
        <div>
            <a href="{% url 'dashboard' %}" class="btn btn-secondary shadow-sm me-2">Quay lại</a>
            <a href="{% url 'category_form' %}" class="btn btn-success fw-bold shadow-sm"><i class="bi bi-plus-circle"></i> Thêm Danh Mục</a>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th width="10%">ID</th>
                        <th>Tên Danh Mục</th>
                        <th width="15%" class="text-center">Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    {% for c in categories %}
                    <tr>
                        <td>#{{ c.id }}</td>
                        <td class="fw-bold">{{ c.name }}</td>
                        <td class="text-center">
                            <a href="{% url 'category_delete' c.id %}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Xóa danh mục này?')"><i class="bi bi-trash"></i> Xóa</a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr><td colspan="3" class="text-center py-4 text-muted">Chưa có danh mục nào!</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
