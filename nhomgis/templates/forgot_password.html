{% extends 'layout.html' %}
{% block content %}
<div class="container mt-5 mb-5 d-flex justify-content-center">
    <div class="card shadow border-0" style="width: 450px; border-radius: 15px;">
        <div class="card-header bg-danger text-white text-center fw-bold fs-5 py-3" style="border-radius: 15px 15px 0 0;">
            <i class="bi bi-key"></i> QUÊN MẬT KHẨU
        </div>
        <div class="card-body p-4 text-center">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} small text-start">{{ message }}</div>
                {% endfor %}
            {% endif %}
            
            <p class="text-muted mb-4">Nhập địa chỉ email bạn đã đăng ký. Chúng tôi sẽ gửi mã OTP gồm 6 chữ số để đặt lại mật khẩu.</p>
            
            <form action="{% url 'forgot_password' %}" method="POST">
                {% csrf_token %}
                <div class="mb-4 text-start">
                    <label class="fw-bold mb-1">Email đăng ký:</label>
                    <input type="email" name="email" class="form-control" placeholder="Nhập email của bạn..." required>
                </div>
                <button type="submit" class="btn btn-danger w-100 fw-bold rounded-pill shadow-sm">
                    <i class="bi bi-send"></i> Gửi Mã OTP
                </button>
            </form>
            
            <div class="mt-3">
                <a href="{% url 'login' %}" class="text-decoration-none small text-primary">Quay lại đăng nhập</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
