{% extends 'layout.html' %}
{% block content %}
<div class="container mt-5 mb-5 d-flex justify-content-center">
    <div class="card shadow border-0" style="width: 450px; border-radius: 15px;">
        <div class="card-header bg-warning text-dark text-center fw-bold fs-5 py-3" style="border-radius: 15px 15px 0 0;">
            <i class="bi bi-shield-lock"></i> XÁC MINH OTP
        </div>
        <div class="card-body p-4 text-center">
            {% if messages %}
                {% for message in messages %}<div class="alert alert-{{ message.tags }} small text-start">{{ message }}</div>{% endfor %}
            {% endif %}
            <p class="text-muted mb-4">Chúng tôi đã gửi mã 6 số đến email <b>{{ request.session.reset_data.email }}</b>. Vui lòng kiểm tra!</p>
            <form action="{% url 'verify_reset_otp' %}" method="POST">
                {% csrf_token %}
                <div class="mb-4">
                    <input type="text" name="otp" class="form-control form-control-lg text-center fw-bold border-warning" placeholder="_ _ _ _ _ _" maxlength="6" style="letter-spacing: 15px; font-size: 24px;" required autocomplete="off">
                </div>
                <button type="submit" class="btn btn-warning w-100 fw-bold rounded-pill shadow-sm"><i class="bi bi-check-circle"></i> Xác nhận mã</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
