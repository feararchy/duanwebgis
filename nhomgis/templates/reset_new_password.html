{% extends 'layout.html' %}
{% block content %}
<div class="container mt-5 mb-5 d-flex justify-content-center">
    <div class="card shadow border-0" style="width: 450px; border-radius: 15px;">
        <div class="card-header bg-success text-white text-center fw-bold fs-5 py-3" style="border-radius: 15px 15px 0 0;">
            <i class="bi bi-unlock"></i> ĐẶT LẠI MẬT KHẨU
        </div>
        <div class="card-body p-4">
            {% if messages %}
                {% for message in messages %}<div class="alert alert-{{ message.tags }} small">{{ message }}</div>{% endfor %}
            {% endif %}
            <form action="{% url 'reset_new_password' %}" method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="fw-bold mb-1">Mật khẩu mới:</label>
                    <input type="password" name="new_password" class="form-control" required>
                </div>
                <div class="mb-4">
                    <label class="fw-bold mb-1">Xác nhận mật khẩu mới:</label>
                    <input type="password" name="confirm_password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold rounded-pill"><i class="bi bi-save"></i> Đổi mật khẩu ngay</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
